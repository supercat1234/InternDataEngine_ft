tasks:
  -
    name: banana_base_task  # task name
    asset_root: workflows/simbox/assets
    task: BananaBaseTask  # !! where you specify TASK class
    task_id: 0

    offset: null
    render: True

    # Arena configuration
    arena_file: workflows/simbox/core/configs/arenas/pick_randomized_arena.yaml

    env_map:
      envmap_lib: envmap_lib
      apply_randomization: True
      intensity_range: [4000, 7000]
      rotation_range: [0, 180]

    robots:
      -
        name: "split_aloha"
        robot_config_file: workflows/simbox/core/configs/robots/split_aloha.yaml
        euler: [0.0, 0.0, 90.0]
        left_joint_home: [0.00484993, 0.34198609, -0.14007858, 0.01680429, 0.14391101, -0.00252178]
        right_joint_home: [0.00484993, 0.34198609, -0.14007858, 0.01680429, 0.14391101, -0.00252178]
        left_joint_home_std: [0.12513939, 0.24539099, 0.24468172, 0.23398885, 0.2710117, 0.21726329]
        right_joint_home_std: [0.12513939, 0.24539099, 0.24468172, 0.23398885, 0.2710117, 0.21726329]
        ignore_substring: ["material"]

    objects:
      # 铰接微波炉：门初始为半开状态（close_v 关键点），便于右臂把食物放进内腔
      -
        name: microwave
        target_class: ArticulatedObject
        dataset: pm
        info_name: "close_v"
        euler: [0.0, 0.0, 0.0]
        scale: [0.001, 0.001, 0.001]
        joint_position_range: [0.78, 0.875]
        apply_randomization: True
        path: ""
        category: ""
        obj_info_path: ""
        art_cat: "art/microwave_gr"
      # 可抓取的刚性食物（默认面包，可换 egg/mooncake 等 pick_objs 类别）
      -
        name: pick_0
        path: art/heat_the_food_in_the_microwave/pick_objs/omniobject3d-bread_090/Aligned_obj.usd
        target_class: RigidObject
        dataset: oo3d
        category: bread
        prim_path_child: Aligned
        translation: [0.0, 0.0, 0.0]
        euler: [0.0, 0.0, 0.0]  # stable init pose
        scale: [0.001, 0.001, 0.001]
        apply_randomization: True
        optimize_2d_layout: False

    regions:
      -
        object: microwave
        target: table
        random_type: A_on_B_region_sampler
        random_config:
          pos_range: [
            [-0.25, 0.0, 0.0],
            [0.05, 0.12, 0.0]
          ]
          yaw_rotation: [-15, 15]
      -
        object: pick_0
        target: table
        random_type: A_on_B_region_sampler
        random_config:
          pos_range: [
            [0.12, -0.28, 0.005],
            [0.28, -0.12, 0.005]
          ]
          yaw_rotation: [0, 0]
      -
        object: split_aloha
        target: table
        random_type: A_on_B_region_sampler
        random_config:
          pos_range: [
            [0.0, -0.86, -0.765],
            [0.0, -0.86, -0.765]
          ]
          yaw_rotation: [0.0, 0.0]

    cameras:
      -
        name: split_aloha_hand_left
        translation: [0.0, 0.08, 0.05]
        orientation: [0.0, 0.0, 0.965, 0.259]
        camera_axes: usd
        camera_file: workflows/simbox/core/configs/cameras/astra.yaml
        parent: "split_aloha/split_aloha_mid_360_with_piper/split_aloha_mid_360_with_piper/fl/link6"
        apply_randomization: False
      -
        name: split_aloha_hand_right
        translation: [0.0, 0.08, 0.04]
        orientation: [0.0, 0.0, 0.972, 0.233]
        camera_axes: usd
        camera_file: workflows/simbox/core/configs/cameras/astra.yaml
        parent: "split_aloha/split_aloha_mid_360_with_piper/split_aloha_mid_360_with_piper/fr/link6"
        apply_randomization: False
      -
        name: split_aloha_head
        translation: [0.0, -0.00818, 0.1]
        orientation: [0.658, 0.259, -0.282, -0.648]
        camera_axes: usd
        camera_file: workflows/simbox/core/configs/cameras/realsense_d455_v3.yaml
        parent: "split_aloha/split_aloha_mid_360_with_piper/split_aloha_mid_360_with_piper/top_camera_link"
        apply_randomization: False

    data:
      task_dir: "heat_the_bread_in_microwave"
      language_instruction: "Pick the bread into the microwave with the right arm, close the door with the left arm, then open it again."
      detailed_language_instruction: "Right arm picks the bread from the table and places it into the microwave cavity. Left arm grabs the door handle, closes the microwave door, then pulls the handle to open it again."
      collect_info: ""
      version: "v0.1 local split_aloha, 1280x720 head + 640x480 wrist"
      update: True
      max_episode_length: 4000

    skills:
      -
        split_aloha:
          # 1) 左臂先规划关门姿态（门此时是半开的）
          -
            left:
              -
                name: artpreplan
                objects: [microwave]
                planner_setting:
                  task_name: CloseBox
                  category_name: Articulated
                  tool_keypoint_name_list: [tool_head, tool_tail, tool_side]
                  object_keypoint_name_list: [articulated_object_head, articulated_object_tail]
                  success_threshold: 0.08
                  constraint_list:
                    - keypoint_name: tool_head
                      target_keypoint_name: articulated_object_head
                      tolerance: 0.0001
                      type: point2point_constraint
                      name: fingers_contact_with_link0
                    - axis_from_keypoint_name: tool_head
                      axis_to_keypoint_name: tool_side
                      cross_target_axis1_from_keypoint_name: articulated_object_head
                      cross_target_axis1_to_keypoint_name: articulated_object_tail
                      tolerance: 0.005
                      target_inner_product: -1
                      type: frame_axis_parallel
                      name: hand_parallel_to_link0_edge_door
                    - axis_from_keypoint_name: tool_head
                      axis_to_keypoint_name: tool_tail
                      cross_target_axis1_from_keypoint_name: articulated_object_head
                      cross_target_axis1_to_keypoint_name: articulated_object_tail
                      target_axis: link0_contact_axis
                      tolerance: 0.005
                      target_inner_product: 0.7
                      type: frame_axis_parallel
                      name: fingers_orthogonal_to_link0
                  contact_pose_index: 2
                  pre_actuation_motions: [["translate_z", -0.05]]
                  post_actuation_motions: [["rotate", 0.2], ["rotate", 0.2], ["rotate", 0.2], ["rotate", 0.1], ["rotate", 0.1], ["rotate", 0.1], ["rotate", 0.1], ["rotate", 0.1]]
                  keypose_random_range:
                    orientation:
                      x_min: -3
                      x_max: 3
                      y_min: -3
                      y_max: 3
                      z_min: -30
                      z_max: 30
                    position:
                      x_min: 0.0
                      x_max: 0.1
                      y_min: -0.05
                      y_max: 0.0
                      z_min: -0.02
                      z_max: 0.0
          # 2) 右臂抓面包并放进微波炉内腔
          -
            right:
              -
                name: pick
                objects: [pick_0]
                filter_y_dir: ["forward", 60]
                filter_z_dir: ["downward", 150]
                pre_grasp_offset: 0.05
                gripper_change_steps: 10
                t_eps: 0.025
                o_eps: 1
                process_valid: True
                lift_th: 0.02
                post_grasp_offset_min: 0.10
                post_grasp_offset_max: 0.15
              -
                name: place
                place_part_prim_path: "base"
                place_direction: "horizontal"
                align_place_obj_axis: [1.0, 0.0, 0.0]
                ignore_substring: ["microwave"]
                objects: [pick_0, microwave]
                filter_z_dir: ["upward", 45]
                filter_x_dir: ["forward", 45]
                y_ratio_range: [0.2, 0.4]
                x_ratio_range: [0.4, 0.6]
                z_ratio_range: [0.4, 0.6]
                pre_place_z_offset: 0.05
                place_z_offset: 0.05
                post_place_vector: [-0.1, 0.0, 0.0]
                success_mode: xybbox
              -
                name: heuristic__skill
                mode: home
                gripper_state: 1.0  # Open gripper
          # 3) 左臂把门关上
          -
            left:
              -
                name: close
                objects: [microwave]
                planner_setting:
                  task_name: CloseBox
                  category_name: Articulated
                  tool_keypoint_name_list: [tool_head, tool_tail, tool_side]
                  object_keypoint_name_list: [articulated_object_head, articulated_object_tail]
                  success_threshold: 0.08
                  constraint_list:
                    - keypoint_name: tool_head
                      target_keypoint_name: articulated_object_head
                      tolerance: 0.0001
                      type: point2point_constraint
                      name: fingers_contact_with_link0
                    - axis_from_keypoint_name: tool_head
                      axis_to_keypoint_name: tool_side
                      cross_target_axis1_from_keypoint_name: articulated_object_head
                      cross_target_axis1_to_keypoint_name: articulated_object_tail
                      tolerance: 0.005
                      target_inner_product: -1
                      type: frame_axis_parallel
                      name: hand_parallel_to_link0_edge_door
                    - axis_from_keypoint_name: tool_head
                      axis_to_keypoint_name: tool_tail
                      cross_target_axis1_from_keypoint_name: articulated_object_head
                      cross_target_axis1_to_keypoint_name: articulated_object_tail
                      target_axis: link0_contact_axis
                      tolerance: 0.005
                      target_inner_product: 0.7
                      type: frame_axis_parallel
                      name: fingers_orthogonal_to_link0
                  contact_pose_index: 2
                  pre_actuation_motions: [["translate_z", -0.05]]
                  post_actuation_motions: [["rotate", 0.15], ["rotate", 0.15], ["rotate", 0.15], ["rotate", 0.1], ["rotate", 0.1], ["rotate", 0.1], ["rotate", 0.1], ["rotate", 0.1], ["rotate", 0.1], ["rotate", 0.1], ["rotate", 0.05], ["rotate", 0.05]]
                  keypose_random_range:
                    orientation:
                      x_min: -3
                      x_max: 3
                      y_min: -3
                      y_max: 3
                      z_min: -30
                      z_max: 30
                    position:
                      x_min: 0.0
                      x_max: 0.1
                      y_min: -0.05
                      y_max: 0.0
                      z_min: -0.02
                      z_max: 0.0
          # 4) 左臂重新抓门把手把门打开（如果关门夹太紧，先把上一步 post_actuation_motions 减少几项）
          -
            left:
              -
                name: open
                objects: [microwave]
                planner_setting:
                  task_name: OpenBox
                  category_name: Articulated
                  tool_keypoint_name_list: [tool_head, tool_tail, tool_side]
                  object_keypoint_name_list: [articulated_object_head, articulated_object_tail]
                  success_threshold: 0.52
                  constraint_list:
                    - keypoint_name: tool_head
                      target_keypoint_name: articulated_object_head
                      tolerance: 0.000001
                      type: point2point_constraint
                      name: fingers_contact_with_link0
                    - axis_from_keypoint_name: tool_head
                      axis_to_keypoint_name: tool_tail
                      target_axis: link0_contact_axis
                      tolerance: 0.3
                      target_inner_product: -1
                      type: frame_axis_parallel
                      name: hand_parallel_to_link0_edge
                    - axis_from_keypoint_name: tool_head
                      axis_to_keypoint_name: tool_side
                      cross_target_axis1_from_keypoint_name: articulated_object_head
                      cross_target_axis1_to_keypoint_name: articulated_object_tail
                      target_axis: link0_contact_axis
                      tolerance: 0.0005
                      target_inner_product: 1
                      type: frame_axis_parallel
                      name: fingers_orthogonal_to_link0
                  contact_pose_index: 2
                  pre_actuation_motions: []
                  post_actuation_motions: [["translate_z", 0.04], ["rotate", -0.2], ["rotate", -0.2], ["rotate", -0.2], ["rotate", -0.2], ["rotate", -0.1], ["rotate", -0.1]]
                  keypose_random_range:
                    orientation:
                      x_min: 0.0
                      x_max: 0.0
                      y_min: 0.0
                      y_max: 0.0
                      z_min: 0.0
                      z_max: 0.0
                    position:
                      x_min: 0.0
                      x_max: 0.0
                      y_min: 0.0
                      y_max: 0.0
                      z_min: 0.0
                      z_max: 0.0
